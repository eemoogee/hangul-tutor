<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eceee6">
  <title>Sejong Test · First Words</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./pyodide/pyodide.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="header">
      <div class="identity"><span class="brand">THE SEJONG TEST</span><strong id="batch-name">First Words</strong></div>
      <button id="menu-button" class="icon-button" type="button" aria-label="Open menu" hidden>⋯</button>
    </header>
    <div id="letters" class="letters" aria-label="Letters learned"></div>
    <section id="screen" class="screen" aria-live="polite"></section>
    <div id="controls" class="controls"></div>
    <p id="status" class="status" role="status"></p>
  </main>
  <div id="dialog-layer" class="dialog-layer" hidden></div>
</body>
</html>
