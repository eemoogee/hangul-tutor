<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f0e7">
<title>Vowel Machine · Hangul Tutor experiment</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;color:#20393c;background:#ede9dd;--ink:#20393c;--muted:#607375;--teal:#147b73;--gold:#e9ad5c;--paper:#fffdf7;--line:#d4dbd4}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible{outline:3px solid #1666bc;outline-offset:3px}button:disabled{opacity:.46;cursor:default}
#app{height:100dvh;display:flex;justify-content:center;background:#bac6c1}.shell{width:min(100%,390px);height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#f4f0e7;box-shadow:0 0 35px #152e3030}
.head{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px 9px;min-height:66px}.brand{flex:1;min-width:0}.brand small{display:block;color:#55716e;letter-spacing:.18em;text-transform:uppercase;font-size:10px;font-weight:900}.brand h1{font-family:Georgia,"Noto Serif KR",serif;font-size:24px;letter-spacing:-.04em;margin:1px 0 0;line-height:1}.head-button{min-width:40px;height:40px;border-radius:12px;background:#fffbf2;border:1px solid #c5d2c9;color:#35575a;font-size:18px;font-weight:800}
.modes{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 14px 9px}.mode{min-height:48px;border:1px solid #c3d1ca;border-radius:13px;background:#fffaf1;color:#4c6667;text-align:left;padding:6px 12px;font-size:12px;font-weight:800;line-height:1.1}.mode small{display:block;font-size:10px;font-weight:500;margin-top:3px}.mode[aria-selected=true]{background:#1e4548;color:#fff;border-color:#1e4548;box-shadow:0 3px 0 #112c2e20}
.content{min-height:0;flex:1;display:flex;flex-direction:column;gap:8px;padding:0 14px 9px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}.machine{flex:none;border-radius:21px;background:radial-gradient(circle at 50% 37%,#244950,#102e33 70%);color:#fff;box-shadow:0 9px 18px #183c3d20;overflow:hidden;position:relative;min-height:315px}.machine:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:29px 29px;mask-image:linear-gradient(#0009,transparent 88%);pointer-events:none}.machine-head{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 0}.machine-head small{display:block;color:#9dcbc2;font-size:10px;letter-spacing:.17em;font-weight:900}.machine-head strong{display:block;font-size:13px;font-weight:750;margin-top:2px}.turn{min-height:36px;border-radius:10px;background:#ffffff16;color:#f8f6eb;border:1px solid #ffffff66;padding:0 10px;font-size:11px;font-weight:800;white-space:nowrap}.turn:active{transform:translateY(1px)}
.canvas-zone{height:202px;position:relative;display:flex;align-items:center;justify-content:center}.canvas-zone svg{width:min(100%,300px);height:195px;overflow:visible;touch-action:none}.guide{stroke:#9bc8c44d;stroke-width:2;stroke-dasharray:3 8}.stem{stroke:#f9f4df;stroke-width:11;stroke-linecap:round;transition:x1 .27s,y1 .27s,x2 .27s,y2 .27s,opacity .2s}.joint{stroke:#efb56d;stroke-width:10;stroke-linecap:round;transition:x2 .18s,y2 .18s,opacity .2s}.is-dragging .joint{transition:none}.handle-ring{fill:#efb56d33;stroke:#efbf7d;stroke-width:2;transition:cx .18s,cy .18s}.is-dragging .handle-ring{transition:none}.handle-core{fill:#f6c37e;pointer-events:none}.drag-hit{fill:transparent;cursor:grab;touch-action:none}.is-dragging .drag-hit{cursor:grabbing}.loose-dot{fill:#efb56d;filter:drop-shadow(0 0 12px #f3b76055)}.readout{position:absolute;right:13px;top:54px;display:flex;align-items:center;gap:7px;z-index:1}.glyph{font-size:52px;font-weight:700;line-height:1;color:#fff5da;text-shadow:0 0 22px #f5ba6970}.sound{font-size:12px;font-weight:800;border:1px solid #c5d8c691;border-radius:9px;padding:3px 7px;color:#d4e9df}.gesture-hint{position:absolute;left:15px;bottom:2px;right:15px;text-align:center;font-size:11px;color:#b2d7d0;z-index:1}.machine-controls{position:relative;z-index:1;min-height:58px;padding:5px 12px 12px;display:flex;gap:7px}.machine-controls button{flex:1;min-height:43px;border-radius:11px;border:1px solid #a9c5bc;background:#ecf7ef;color:#173c3d;font-weight:850;font-size:12px}.machine-controls button[aria-pressed=true]{background:#f4bc75;border-color:#f4bc75}.machine-controls .key{font-size:29px;line-height:1}.machine-controls .clear{flex:0 0 55px;background:#ffffff19;color:#f7f7e9;border-color:#ffffff55;font-size:11px}.sequence{position:absolute;left:13px;bottom:69px;color:#b7d7d1;font-size:11px;font-weight:700;letter-spacing:.04em}
.dialogue{flex:none;min-height:75px;display:flex;align-items:center;gap:10px;background:#fffdf6;border:1px solid #d7ded4;border-radius:15px;padding:7px 10px}.mascot{height:60px;width:57px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 2px #0002)}.dialogue-text{min-width:0;line-height:1.3;font-size:12px;color:#365153;max-height:65px;overflow:auto}.dialogue-text b{display:block;color:#94713e;font-size:9px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:3px}.dialogue-text p{margin:0}
.grid-card{flex:none;background:#fffdf7;border:1px solid #d5ddd2;border-radius:15px;padding:9px 10px 10px}.grid-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}.grid-top strong{font-family:Georgia,serif;font-size:15px}.grid-top small{font-size:10px;color:#6c7c79;font-weight:700}.grid{display:grid;grid-template-columns:33px repeat(4,1fr);gap:5px}.axis,.cell{min-width:0;min-height:43px;border-radius:9px;display:grid;place-items:center}.axis{font-size:21px;font-weight:700;color:#315b5d;background:#ebf0ea}.axis.empty{background:transparent}.cell{border:1px dashed #c7d3c9;background:#f2f3eb;color:#b1bcb3;font-size:24px;font-weight:800}.cell.open{border:1px solid #83c1ad;background:#daf2e6;color:#17584f;box-shadow:inset 0 -3px 0 #9bd6c0}.cell.open:active{transform:translateY(2px)}.cell.just-opened{animation:lightup .55s both}.composition{min-height:24px;margin-top:5px;font-size:11px;color:#476663;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:6px}.composition strong{font-size:13px;color:#18584f}.composition .quiet{font-weight:500;color:#71817c}
.foot{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px max(10px,env(safe-area-inset-bottom));background:#f4f0e7}.next{min-height:45px;flex:1;border:0;border-radius:12px;background:#147b73;color:#fff;font-weight:850;font-size:13px}.restart{min-height:45px;border-radius:12px;border:1px solid #b9cbc2;background:#fffaf2;color:#355d5c;font-weight:800;font-size:11px;padding:0 10px}.foot-note{font-size:9px;color:#75847f;text-align:center;padding:0 14px 6px;background:#f4f0e7}
.about-cover{position:fixed;inset:0;background:#14292cc4;display:flex;align-items:center;justify-content:center;z-index:20;padding:15px}.about{max-width:390px;width:100%;max-height:80dvh;overflow:auto;background:#fffdf7;border-radius:19px;padding:18px;color:#283f42;box-shadow:0 15px 50px #0005}.about h2{font-family:Georgia,serif;margin:0 0 9px}.about p,.about li{font-size:13px;line-height:1.45}.about a{color:#0d685e}.about button{border:0;border-radius:10px;background:#147b73;color:#fff;padding:10px 17px;font-weight:800;width:100%;margin-top:8px}
@keyframes lightup{from{transform:scale(.72);opacity:.3;box-shadow:0 0 0 0 #d4a252aa}to{transform:scale(1);opacity:1;box-shadow:0 0 0 10px #d4a25200}}
@media(max-height:720px){.head{min-height:52px;padding-top:7px;padding-bottom:5px}.brand h1{font-size:20px}.modes{padding-bottom:5px}.mode{min-height:41px}.content{gap:5px;padding-bottom:5px}.machine{min-height:252px}.machine-head{padding-top:8px}.canvas-zone{height:145px}.canvas-zone svg{height:145px}.readout{top:39px}.glyph{font-size:40px}.gesture-hint{font-size:10px}.machine-controls{min-height:53px;padding-bottom:7px}.machine-controls button{min-height:38px}.sequence{bottom:57px}.dialogue{min-height:58px;padding:5px 8px}.mascot{height:47px;width:45px}.dialogue-text{font-size:11px;max-height:53px}.grid-card{padding:6px 8px}.grid-top{margin-bottom:3px}.axis,.cell{min-height:36px}.composition{margin-top:3px;min-height:20px}.foot{padding-top:5px;padding-bottom:7px}.next,.restart{min-height:40px}.foot-note{display:none}}
@media(max-width:340px){.head{padding-left:11px;padding-right:11px}.modes,.content,.foot{padding-left:10px;padding-right:10px}.grid{gap:3px}.mode{padding:5px 8px}.readout{right:7px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  'use strict';
  const app=document.getElementById('app');
  const vowels=['ㅏ','ㅓ','ㅗ','ㅜ'];
  const sounds={'ㅏ':'a','ㅓ':'eo','ㅗ':'o','ㅜ':'u'};
  const blocks={'ㅏ':'나','ㅓ':'너','ㅗ':'노','ㅜ':'누'};
  const blockSounds={'ㅏ':'na','ㅓ':'neo','ㅗ':'no','ㅜ':'nu'};
  const twoKeys={'ㅣㆍ':'ㅏ','ㆍㅣ':'ㅓ','ㆍㅡ':'ㅗ','ㅡㆍ':'ㅜ'};
  const state={mode:'stroke',dragging:false,about:false,stroke:{axis:'vertical',side:1,found:new Set(['ㅏ']),glyph:'ㅏ',selected:'',message:'Slide the amber joint through the line. Nothing here can break.',tone:'curious',last:''},keys:{sequence:[],found:new Set(),glyph:'',selected:'',message:'These three marks can make four different vowels. Try any two.',tone:'curious',last:''}};
  const current=()=>state[state.mode];
  const vowelAt=(axis,side)=>axis==='vertical'?(side<0?'ㅓ':'ㅏ'):(side<0?'ㅗ':'ㅜ');
  const escapeHtml=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function geometry(axis,side){if(axis==='vertical')return {stem:[160,37,160,174],short:[160,107,160+76*side,107],handle:[160+76*side,107]};return {stem:[77,107,243,107],short:[160,107,160,107+64*side],handle:[160,107+64*side]};}
  function setLine(el,points){['x1','y1','x2','y2'].forEach((name,i)=>el.setAttribute(name,points[i]));}
  function updateGeometry(axis,side,partial='full'){
    const g=geometry(axis,side),stem=document.getElementById('stem'),joint=document.getElementById('joint'),ring=document.getElementById('handleRing'),core=document.getElementById('handleCore'),hit=document.getElementById('dragHit'),dot=document.getElementById('looseDot');
    if(!stem)return;
    if(partial==='dot'){stem.style.opacity='0';joint.style.opacity='0';dot.style.opacity='1';ring.style.opacity='0';core.style.opacity='0';hit.style.pointerEvents='none';return}
    stem.style.opacity='1';dot.style.opacity='0';hit.style.pointerEvents=state.mode==='stroke'?'all':'none';
    setLine(stem,g.stem);setLine(joint,g.short);joint.style.opacity=partial==='base'?'0':'1';
    for(const el of [ring,core,hit]){el.setAttribute('cx',g.handle[0]);el.setAttribute('cy',g.handle[1])}
    ring.style.opacity=core.style.opacity=partial==='base'?'0':'1';
  }
  function gridHtml(){const s=current(),open=s.found;return `<div class="grid"><span class="axis empty"></span>${vowels.map(v=>`<span class="axis" aria-label="Vowel ${v}">${v}</span>`).join('')}<span class="axis" aria-label="Consonant nieun">ㄴ</span>${vowels.map(v=>`<button class="cell ${open.has(v)?'open':''} ${s.last===v?'just-opened':''}" data-cell="${v}" ${open.has(v)?'': 'disabled'} aria-label="${open.has(v)?`${blocks[v]}, made from ㄴ and ${v}`:`${v} not yet discovered`}">${open.has(v)?blocks[v]:'·'}</button>`).join('')}</div>`}
  function machineControls(){if(state.mode==='stroke'){const s=state.stroke,vertical=s.axis==='vertical';return `<button data-side="-1" aria-pressed="${s.side===-1}">${vertical?'← Left':'↑ Above'}</button><button data-side="1" aria-pressed="${s.side===1}">${vertical?'Right →':'Below ↓'}</button>`}return `<button class="key" data-key="ㆍ" aria-label="Dot, heaven">ㆍ</button><button class="key" data-key="ㅡ" aria-label="Horizontal line, earth">ㅡ</button><button class="key" data-key="ㅣ" aria-label="Vertical line, human">ㅣ</button><button class="clear" data-action="clear" aria-label="Clear current pair">Clear</button>`}
  function mainLabel(){const s=current();if(state.mode==='stroke'){if(!s.found.has('ㅓ'))return 'Try the other side';if(s.axis==='vertical')return 'Turn the base for ㅗ ↔ ㅜ';if(!s.found.has('ㅜ'))return 'Try below the line';return 'Compare the three keys'}if(s.found.size===4)return 'Compare stroke movement';return 'Try the other machine'}
  function render(){const s=current(),isStroke=state.mode==='stroke';app.innerHTML=`<main class="shell" id="shell"><header class="head"><div class="brand"><small>Hangul Tutor · experiment</small><h1>Vowel Machine</h1></div><button class="head-button" data-action="about" aria-label="About this experiment">ⓘ</button></header><nav class="modes" role="tablist" aria-label="Choose machine"><button class="mode" role="tab" data-mode="stroke" aria-selected="${isStroke}">Move strokes<small>Transform a shape</small></button><button class="mode" role="tab" data-mode="keys" aria-selected="${!isStroke}">Three keys<small>Discover an order</small></button></nav><div class="content" id="content"><section class="machine" aria-label="Vowel workbench"><div class="machine-head"><div><small>THE LITTLE MACHINE</small><strong>${isStroke?'One joint · two sides':s.sequence.length===2?'A pair becomes a shape':'Three marks · many shapes'}</strong></div>${isStroke?'<button class="turn" data-action="turn">Turn base ↻</button>':'<span style="font-size:10px;color:#b7d6cd">tap two marks</span>'}</div><div class="canvas-zone" id="canvasZone"><svg id="canvas" viewBox="0 0 320 210" role="img" aria-label="${isStroke?'Move the short stroke to change the vowel':s.glyph?`Constructed vowel ${s.glyph}`:'Vowel construction area'}"><line class="guide" x1="160" y1="15" x2="160" y2="195"/><line class="guide" x1="61" y1="107" x2="259" y2="107"/><circle id="looseDot" class="loose-dot" cx="160" cy="107" r="10" style="opacity:0"/><line id="stem" class="stem"/><line id="joint" class="joint"/><circle id="handleRing" class="handle-ring" r="19"/><circle id="handleCore" class="handle-core" r="8"/><circle id="dragHit" class="drag-hit" r="28" aria-label="Draggable short stroke"/></svg><div class="readout"><span class="glyph" id="glyph">${s.glyph||'·'}</span>${s.glyph?`<span class="sound">${sounds[s.glyph]}</span>`:''}</div>${isStroke?'<div class="gesture-hint">Drag the amber joint, or use the buttons below.</div>':''}</div>${!isStroke?`<div class="sequence" aria-live="polite">${s.sequence.length?`YOUR PAIR · ${escapeHtml(s.sequence.join(' → '))}`:'YOUR PAIR · choose a first mark'}</div>`:''}<div class="machine-controls">${machineControls()}</div></section><section class="dialogue" aria-label="Guide reaction"><img class="mascot" src="assets/jeong_${s.tone}.png" alt="Jeong, ${s.tone} pose"><div class="dialogue-text"><b>Jeong · imagined prototype dialogue</b><p id="message" role="status" aria-live="polite">${escapeHtml(s.message)}</p></div></section><section class="grid-card" aria-label="Syllable row"><div class="grid-top"><strong>The row you're making</strong><small>${s.found.size} of 4 vowel paths open</small></div>${gridHtml()}<div class="composition" id="composition">${s.selected?`<span>ㄴ + ${s.selected} → <strong>${blocks[s.selected]}</strong> · ${blockSounds[s.selected]}</span><span class="quiet">Tap another cell</span>`:`<span class="quiet">Tap a lit block to see what ㄴ becomes.</span>`}</div></section></div><footer class="foot"><button class="next" data-action="next">${mainLabel()}</button><button class="restart" data-action="restart">Start over</button></footer><div class="foot-note">Experiment only · no audio, scores, or saved progress</div></main>${state.about?aboutHtml():''}`;
    if(isStroke){updateGeometry(s.axis,s.side)}else if(s.sequence.length===1){const first=s.sequence[0];updateGeometry(first==='ㅣ'?'vertical':'horizontal',1,first==='ㆍ'?'dot':'base')}else if(s.glyph){const spec={'ㅏ':['vertical',1],'ㅓ':['vertical',-1],'ㅗ':['horizontal',-1],'ㅜ':['horizontal',1]}[s.glyph];updateGeometry(spec[0],spec[1])}else updateGeometry('vertical',1,'dot');
  }
  function aboutHtml(){return `<div class="about-cover"><div class="about" role="dialog" aria-modal="true" aria-label="About Vowel Machine"><h2>What this machine is testing</h2><p>Move one short mark across or through a line, then try constructing the same shapes from ㆍ, ㅡ, and ㅣ. Each discovered vowel opens a syllable with ㄴ in the row below.</p><p><strong>Documented principle:</strong> The National Hangeul Museum describes the three foundational vowel signs as heaven, earth, and human, and explains how adding ㆍ to ㅡ and ㅣ yields ㅗ, ㅜ, ㅏ, and ㅓ. <a href="https://www.hangeul.go.kr/exhibition/541" target="_blank" rel="noopener">Museum explanation ↗</a></p><p><strong>Prototype inventions:</strong> The sliding joint, two-tap order rule, illuminated grid, and all Jeong dialogue are interaction designs. They are not claims about historical typing or a quotation from Jeong.</p><p>The Latin sound labels are reading cues, not audio or exact pronunciation. Progress is kept only while this page stays open.</p><button data-action="about">Return to the machine</button></div></div>`}
  function discover(v,message){const s=current(),newOne=!s.found.has(v);s.found.add(v);s.glyph=v;s.last=newOne?v:'';s.selected='';s.tone=newOne?'delighted':'hello';s.message=message;render()}
  function moveSide(side){const s=state.stroke;if(s.side===side){s.message='The joint is already there. Cross the line to hear what changes on the other side.';s.tone='curious';render();return}s.side=side;const v=vowelAt(s.axis,side);discover(v,s.axis==='vertical'?`${v}: same ㅣ, short mark on the ${side<0?'left':'right'}. A new vowel from one move.`:`${v}: same ㅡ, short mark ${side<0?'above':'below'}. The vowel changes with the position.`)}
  function turnBase(){const s=state.stroke;s.axis=s.axis==='vertical'?'horizontal':'vertical';s.side=s.axis==='horizontal'?-1:1;const v=vowelAt(s.axis,s.side);discover(v,s.axis==='horizontal'?'The long line lies flat now. This is ㅗ. What happens if you move its short mark below?':'The long line stands up again. Try either side of it.');}
  function pressKey(key){const s=state.keys;s.selected='';s.last='';if(s.sequence.length>=2)s.sequence=[];s.sequence.push(key);s.tone='curious';if(s.sequence.length===1){s.glyph='';s.message=key==='ㆍ'?'A dot first. Which long line will it meet?':`A ${key==='ㅣ'?'standing':'lying'} line first. Where will the dot arrive?`;render();return}const made=twoKeys[s.sequence.join('')];if(made){const completesRow=s.found.size===3&&!s.found.has(made);discover(made,`You pressed ${s.sequence.join(' then ')}. The marks became ${made}. ${completesRow?'The entire ㄴ row is now open.':'Try reversing the order to see what moves.'}`)}else{s.glyph='';s.tone='hello';s.message='Those two marks do not make one of these four vowels. Try another pair; nothing is lost.';render()}}
  function clearKeys(){const s=state.keys;s.sequence=[];s.glyph='';s.tone='curious';s.message='A clean workbench. Try a different first mark.';render()}
  function restart(){if(state.mode==='stroke'){state.stroke={axis:'vertical',side:1,found:new Set(['ㅏ']),glyph:'ㅏ',selected:'',message:'Slide the amber joint through the line. Nothing here can break.',tone:'curious',last:''}}else{state.keys={sequence:[],found:new Set(),glyph:'',selected:'',message:'These three marks can make four different vowels. Try any two.',tone:'curious',last:''}}render()}
  function nextAction(){if(state.mode==='stroke'){const s=state.stroke;if(!s.found.has('ㅓ'))moveSide(-1);else if(s.axis==='vertical')turnBase();else if(!s.found.has('ㅜ'))moveSide(1);else{state.mode='keys';render()}}else{state.mode='stroke';render()}}
  function selectCell(v){const s=current();if(!s.found.has(v))return;s.selected=v;s.last='';s.tone='hello';s.message=`Place ㄴ with ${v}: ${blocks[v]}. One vowel you made now changes a whole syllable block.`;render()}
  function svgPoint(event){const svg=document.getElementById('canvas');const pt=svg.createSVGPoint();pt.x=event.clientX;pt.y=event.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())}
  function dragProgress(event){const s=state.stroke,p=svgPoint(event);return Math.max(-1,Math.min(1,s.axis==='vertical'?(p.x-160)/76:(p.y-107)/64))}
  app.addEventListener('pointerdown',e=>{if(state.mode!=='stroke'||!e.target.closest('#dragHit'))return;e.preventDefault();const svg=document.getElementById('canvas');state.dragging=true;svg.classList.add('is-dragging');svg.setPointerCapture(e.pointerId);updateGeometry(state.stroke.axis,dragProgress(e));});
  app.addEventListener('pointermove',e=>{if(!state.dragging)return;updateGeometry(state.stroke.axis,dragProgress(e))});
  app.addEventListener('pointerup',e=>{if(!state.dragging)return;const side=dragProgress(e)<0?-1:1;state.dragging=false;moveSide(side)});
  app.addEventListener('pointercancel',()=>{if(!state.dragging)return;state.dragging=false;render()});
  app.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.mode){state.mode=el.dataset.mode;render();return}if(el.dataset.side){moveSide(Number(el.dataset.side));return}if(el.dataset.key){pressKey(el.dataset.key);return}if(el.dataset.cell){selectCell(el.dataset.cell);return}switch(el.dataset.action){case'turn':turnBase();break;case'clear':clearKeys();break;case'next':nextAction();break;case'restart':restart();break;case'about':state.about=!state.about;render();break}});
  app.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.about){state.about=false;render()}});
  window.__vowelMachine={state,render,moveSide,turnBase,pressKey};
  render();
})();
</script>
</body>
</html>
