<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hangul Tutor · Adaptive Composition Lab</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#29313d;--keyboard-height:0px}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #ee8d3d;outline-offset:2px}button:disabled{opacity:.5;cursor:default}
#app{height:100%;background:#aeb9c4;display:flex;justify-content:center}.shell{height:calc(100dvh - var(--keyboard-height));width:min(100%,390px);display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:0 0 35px #26304433;transition:background .2s}
.top{flex:none;display:flex;align-items:center;gap:7px;padding:8px 12px;min-height:57px}.brand{flex:1;min-width:0;line-height:1.1}.brand small{display:block;font-size:9px;letter-spacing:.16em;font-weight:850;text-transform:uppercase;opacity:.65}.brand strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plain{border:1px solid currentColor;color:inherit;background:transparent;border-radius:10px;padding:7px 9px;font-size:11px;font-weight:750}.icon{min-width:37px;min-height:37px;font-size:19px;padding:0}.concepts,.modes{flex:none;display:flex;gap:5px;padding:0 11px 7px}.concepts button,.modes button{flex:1;border:1px solid currentColor;border-radius:10px;background:transparent;color:inherit;padding:7px 3px;font-size:11px;font-weight:800;min-width:0}.concepts button[aria-pressed="true"],.modes button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}.modes button{font-size:12px;padding:8px 2px}.modes{border-bottom:1px solid #8080804c}
.workspace{min-height:0;flex:1;overflow:auto;overscroll-behavior:contain;padding:10px 13px 14px;scrollbar-width:thin}.instruction{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.65;margin:2px 2px 8px}.stage{height:clamp(152px,26dvh,235px);border-radius:20px;position:relative;overflow:hidden;border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;padding:12px 70px 12px 12px}.stage:before{content:"";position:absolute;inset:auto 10% 0;height:30%;background:var(--stage-floor);filter:blur(25px);pointer-events:none}.stage-inner{z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0}.stage-hint{font-size:10px;font-weight:800;opacity:.68;text-align:center;line-height:1.25}.mascot{position:absolute;right:6px;bottom:4px;height:clamp(80px,14dvh,125px);max-width:27%;object-fit:contain;z-index:1;filter:drop-shadow(0 3px 3px #0003)}
.block{width:108px;height:108px;display:grid;border:2px dashed var(--edge);border-radius:17px;background:var(--board);padding:8px;box-shadow:0 4px 12px #00000013}.block.vertical{grid-template-columns:1fr 1fr;grid-template-rows:1fr}.block.horizontal{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.block .part{display:grid;place-items:center;font-family:"Noto Sans KR",system-ui,sans-serif;font-size:42px;font-weight:800;line-height:1;border-radius:10px;color:var(--letter)}.block .part.filled{background:var(--part-bg)}.block .part.slot{border:2px dashed var(--edge);background:#ffffff18;color:var(--letter);font-size:28px;min-width:0}.block .part.slot:focus-visible{outline-offset:-2px}.block.horizontal .part{font-size:40px}.block.horizontal .part.slot{font-size:26px}.block .part.fixed-empty{font-size:25px;opacity:.42}.composed{font-size:13px;font-weight:800;background:var(--part-bg);color:var(--letter);border-radius:8px;padding:2px 8px}.composed b{font-size:22px}.dialogue{border:1px solid var(--edge);border-radius:14px;margin:9px 0;background:var(--dialogue);padding:9px 11px;min-height:72px}.speaker{font-size:10px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;margin-bottom:3px;color:var(--speaker)}.dialogue-text{font-size:13px;line-height:1.35;max-height:88px;overflow:auto}.exercise{border:1px solid var(--edge);border-radius:14px;background:var(--exercise);padding:10px 11px}.task{font-size:14px;font-weight:750;line-height:1.3;margin:0 0 8px}.choices{display:flex;gap:8px;flex-wrap:wrap}.tile{min-width:50px;min-height:47px;background:var(--tile);color:var(--letter);border:1px solid var(--edge);border-radius:10px;font-family:"Noto Sans KR",system-ui,sans-serif;font-size:27px;font-weight:800;box-shadow:0 3px 0 #00000012}.tile[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}.tile:active{transform:translateY(2px)}.tile-label{font-size:10px;opacity:.72;margin-top:6px}.group-label{font-size:10px;font-weight:850;letter-spacing:.08em;margin:7px 0 4px;text-transform:uppercase}.feedback{margin-top:8px;border-radius:9px;padding:7px 9px;font-size:12px;line-height:1.3;font-weight:750;background:var(--feedback);min-height:32px}.feedback.good{border-left:3px solid #3e9a77}.feedback.try{border-left:3px solid #db825b}.input-line{display:flex;gap:7px}.answer{height:43px;min-width:0;flex:1;border:2px solid var(--edge);border-radius:9px;background:#fff;color:#192532;padding:6px 9px;font-size:18px}.input-line button{border:1px solid var(--edge);background:var(--tile);color:var(--letter);border-radius:9px;padding:0 10px;font-size:11px;font-weight:800}.footnote{font-size:10px;line-height:1.3;opacity:.68;margin-top:7px}
.footer{flex:none;padding:8px 13px max(10px,env(safe-area-inset-bottom));border-top:1px solid #8080804c;background:var(--footer)}.footer-row{display:flex;gap:7px;margin-bottom:7px}.footer-row>*{flex:1}.primary{width:100%;min-height:44px;border:0;border-radius:11px;background:var(--accent);color:var(--accent-text);font-size:14px;font-weight:850}.footer .plain{min-height:34px}.footer-note{font-size:10px;opacity:.7;text-align:center;line-height:1.2;margin-top:5px}
.theme-a{--accent:#aa5139;--accent-text:#fff;--edge:#ceaa81;--board:#fff3df;--part-bg:#f2d3ab;--letter:#803d31;--dialogue:#fff8e9;--exercise:#fff5e4;--tile:#fff2d8;--feedback:#fff8e9;--speaker:#a44935;--footer:#f6e7d0;--stage-floor:#c68f5b55;background:#f7e9d3;color:#463527}.theme-a .top{background:#efd9bb}.theme-a .stage{background:radial-gradient(circle at 85% 17%,#fbd28d 0 11%,transparent 11.5%),linear-gradient(#fcebd0 70%,#e9c6a0 70%);box-shadow:0 4px 0 #e0bc91}.theme-a .dialogue{box-shadow:4px 4px 0 #b9815730}.theme-a .speaker,.theme-a .instruction{font-family:Georgia,serif}
.theme-b{--accent:#2d6f9f;--accent-text:#fff;--edge:#9dbbd0;--board:#fff;--part-bg:#e6f1f9;--letter:#24577e;--dialogue:#edf6fb;--exercise:#fff;--tile:#f8fcff;--feedback:#e9f5fa;--speaker:#2b6e9e;--footer:#edf6fb;--stage-floor:#8ec2e855;background:#f5f9fd;color:#23425c}.theme-b .top{background:#e3f0f8}.theme-b .stage{border-radius:8px;background:linear-gradient(90deg,transparent 30px,#e8a5a2 30px,#e8a5a2 31px,transparent 31px),repeating-linear-gradient(0deg,#fff 0px,#fff 25px,#dceaf3 26px,#fff 27px)}.theme-b .exercise{border-left:4px solid #79a9cd}
.theme-c{--accent:#f0a166;--accent-text:#272044;--edge:#7777a3;--board:#2c335e;--part-bg:#444a7a;--letter:#ffe5ae;--dialogue:#30355e;--exercise:#272c53;--tile:#333a68;--feedback:#45436a;--speaker:#ffce8d;--footer:#1c2042;--stage-floor:#ffb46f66;background:#1c2042;color:#f7efff}.theme-c .top{background:#282b54}.theme-c .stage{background:radial-gradient(circle at 45% 52%,#4d5da688,#25294e 72%);box-shadow:inset 0 -15px 35px #0005}.theme-c .block{box-shadow:0 0 24px #a9baff33}.theme-c .dialogue{box-shadow:0 0 13px #aabaff1d}.theme-c .stage-hint{color:#ead4ff}
.review-cover{position:fixed;inset:0;background:#162033bb;z-index:20;display:flex;justify-content:center;align-items:flex-end}.review{background:#fff9ef;color:#263747;border-radius:22px 22px 0 0;width:min(390px,100%);max-height:80dvh;overflow:auto;padding:17px}.review h2{font:600 23px Georgia,serif;margin:0 0 5px}.review p{font-size:12px;line-height:1.4}.review button{display:block;width:100%;text-align:left;border:1px solid #dfd0bd;border-radius:9px;background:#fff;padding:10px;margin:6px 0;color:#263747;font-weight:700}.review .close{width:auto;margin-left:auto;background:#f1e4d0}.mock-keyboard{height:156px;position:fixed;bottom:0;left:0;right:0;z-index:10;background:#d5dce5;color:#2e3b4b;border-top:2px solid #a6b3c1;padding:5px;display:flex;flex-direction:column;gap:5px}.mock-keyboard small{text-align:center;font-size:10px;font-weight:800}.key-row{display:flex;gap:5px;flex:1}.key-row button{flex:1;border:1px solid #a9b6c4;border-radius:7px;background:#fff;color:#22364b;font-weight:800;min-width:0}.key-row .wide{flex:2}
@media(max-height:600px){.top{min-height:49px;padding-top:5px;padding-bottom:5px}.concepts{padding-bottom:4px}.concepts button,.modes button{padding-top:5px;padding-bottom:5px}.workspace{padding-top:6px}.stage{height:145px}.dialogue{min-height:58px;padding:7px 9px}.dialogue-text{max-height:60px}.footer{padding-top:5px}.footer-row{margin-bottom:5px}.primary{min-height:39px}.footer .plain{min-height:30px}.footer-note{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body><div id="app"></div>
<script>
(() => {
  "use strict";
  const app=document.getElementById('app');
  const names={a:'Illustrated Storybook',b:'Living Workbook',c:'Interactive Hangul Stage'};
  const examples=[{consonant:'ㄴ',vowel:'ㅏ',block:'나',sound:'na',orientation:'vertical'}, {consonant:'ㄴ',vowel:'ㅗ',block:'노',sound:'no',orientation:'horizontal'}];
  const predictions=[{consonant:'ㄴ',vowel:'ㅏ',block:'나',sound:'na',orientation:'vertical',missing:'vowel',options:['ㅏ','ㅓ','ㅗ']}, {consonant:'ㄴ',vowel:'ㅗ',block:'노',sound:'no',orientation:'horizontal',missing:'vowel',options:['ㅗ','ㅜ','ㅏ']}, {consonant:'ㄴ',vowel:'ㅗ',block:'노',sound:'no',orientation:'horizontal',missing:'consonant',options:['ㄴ','ㄷ','ㅁ']}];
  const makeSession=()=>({discover:{index:0,selected:'',placed:false,feedback:'',correct:false},predict:{index:0,feedback:'',correct:false},recall:{index:0,consonant:'',vowel:'',typed:'',feedback:'',correct:false}});
  const params=new URLSearchParams(location.search);
  const initialConcept=['a','b','c'].includes(params.get('concept'))?params.get('concept'):'a';
  const initialMode=['discover','predict','recall'].includes(params.get('mode'))?params.get('mode'):'discover';
  const state={concept:initialConcept,mode:initialMode,sessions:{a:makeSession(),b:makeSession(),c:makeSession()},long:false,keyboard:false,review:false};
  const current=()=>state.sessions[state.concept][state.mode];
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const feedback=(message,good)=>message?`<div class="feedback ${good?'good':'try'}" role="status" aria-live="polite">${esc(message)}</div>`:'';
  const lesson=()=>state.mode==='discover'?examples[Math.min(current().index,1)]:state.mode==='predict'?predictions[Math.min(current().index,2)]:examples[Math.min(current().index,1)];
  function board(example,consonant,vowel,slotType){
    const part=(type,value)=>value?`<span class="part filled" data-part="${type}">${esc(value)}</span>`:`<button class="part slot" data-slot="${type}" aria-label="Place ${type} here">?</button>`;
    const c=slotType==='consonant'?part('consonant',consonant):part('consonant',consonant);
    const v=part('vowel',vowel);
    return `<div class="block ${example.orientation}" aria-label="Syllable frame: consonant ${example.orientation==='vertical'?'left, vowel right':'above, vowel below'}">${c}${v}</div>`;
  }
  function content(){
    const s=current(),ex=lesson();let visual='',task='',controls='',msg='',good=s.correct;
    if(state.mode==='discover'){
      visual=board(ex,ex.consonant,s.placed?ex.vowel:'','vowel');
      task=`Choose ${ex.vowel==='ㅏ'?'the upright vowel ㅏ':'the flat vowel ㅗ'} and place it ${ex.orientation==='vertical'?'to the right of':'below'} ㄴ.`;
      controls=`<div class="choices" aria-label="Vowel tiles">${(ex.vowel==='ㅏ'?['ㅏ','ㅗ','ㅓ']:['ㅗ','ㅏ','ㅜ']).map(x=>`<button class="tile" draggable="true" data-tile="${x}" aria-pressed="${s.selected===x}">${x}</button>`).join('')}</div><div class="tile-label">Tap a tile, then the dotted slot. You can also drag a tile into the slot.</div>`;
      if(s.placed)visual+=`<div class="composed"><b>${ex.block}</b> · ${ex.sound}</div>`;
      msg=feedback(s.feedback,s.placed);
    } else if(state.mode==='predict'){
      visual=board(ex,ex.missing==='consonant'?(s.correct?ex.consonant:''):ex.consonant,ex.missing==='vowel'?(s.correct?ex.vowel:''):ex.vowel,ex.missing);
      task=`Which ${ex.missing} completes this block? ${ex.index===0?'':''}`;
      controls=`<div class="choices" aria-label="Missing ${ex.missing} choices">${ex.options.map(x=>`<button class="tile" data-predict="${x}">${x}</button>`).join('')}</div><div class="tile-label">Look at the ${ex.missing==='vowel'?'vowel position':'consonant position'} before choosing.</div>`;
      msg=feedback(s.feedback,s.correct);
    } else if(s.index<2){
      visual=board(ex,s.consonant,s.vowel,'both');
      task=`Build the syllable for the sound “${ex.sound}.”`;
      controls=`<div class="group-label">Consonant</div><div class="choices">${['ㄴ','ㄷ','ㅁ'].map(x=>`<button class="tile" data-recall="consonant:${x}" aria-pressed="${s.consonant===x}">${x}</button>`).join('')}</div><div class="group-label">Vowel</div><div class="choices">${['ㅏ','ㅗ','ㅓ','ㅜ'].map(x=>`<button class="tile" data-recall="vowel:${x}" aria-pressed="${s.vowel===x}">${x}</button>`).join('')}</div><div class="group-label">Or type the Hangul block</div><div class="input-line"><input id="answer" class="answer" lang="ko" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type the Hangul syllable" value="${esc(s.typed)}"><button data-action="keyboard">${state.keyboard?'Hide':'Demo'} keys</button></div>`;
      msg=feedback(s.feedback,s.correct);
    } else {
      visual=`<div class="composed" style="font-size:64px" aria-label="Hangul block ${examples[1].block}">${examples[1].block}</div>`;
      task='Read this Hangul block aloud, then type its sound in Latin letters.';
      controls=`<div class="input-line"><input id="answer" class="answer" lang="en" inputmode="latin" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type the sound of the Hangul block" value="${esc(s.typed)}"><button data-action="keyboard">${state.keyboard?'Hide':'Demo'} keys</button></div><div class="footnote">The sound is hidden until you answer. This is a separate decoding check.</div>`;
      msg=feedback(s.feedback,s.correct);
    }
    return {visual,task,controls,msg};
  }
  function dialogue(){const s=current(),ex=lesson();if(s.feedback) return s.correct?`Yes. ${s.feedback} ${state.long?'Notice how the two letters keep their own shape even while sharing a square. Take a moment to look before moving on.':''}`:`Try again. ${s.feedback} ${state.long?'The consonant and vowel play different roles. Check which component you changed, and where the vowel belongs.':''}`;
    if(state.mode==='discover')return state.long?`I’ll keep ㄴ in place. Choose the vowel, then put it in its position. With ㅏ the vowel stands to the right; with ㅗ it rests below. You control when the letters meet.`:`Jeong: Put ${ex.vowel} ${ex.orientation==='vertical'?'beside':'under'} ㄴ. I’ll wait.`;
    if(state.mode==='predict')return state.long?`One component is missing. Read the frame before you choose: is the empty position for a consonant or a vowel? The other letters are clues, but the answer is yours.`:`Jeong: One letter is missing. What fits?`;
    if(s.index===2)return state.long?`Now read without a sound label. You have seen this block before, but I will not show its romanization until you submit your own reading.`:`Jeong: Your turn to read. No sound label this time.`;
    return state.long?`I’ll give you only the sound. Pick a consonant and vowel to build the block, or type the completed Hangul syllable. Correct either component as often as you need before checking.`:`Jeong: Build “${ex.sound}.” I won’t place the letters for you.`;
  }
  function pose(){const s=current();return !s.feedback?'curious':s.correct?'delighted':'hello';}
  function primaryLabel(){const s=current();if(state.mode==='discover')return s.placed?(s.index===0?'Continue to 노':'Discover complete · restart'):'Place selected vowel';if(state.mode==='predict')return s.correct?(s.index<2?'Next prediction':'Predict complete · restart'):'Choose a letter above';return s.correct?(s.index<2?'Next sound':s.index===2?'Recall complete · restart':'Continue'):'Check answer';}
  function render(){
    document.documentElement.style.setProperty('--keyboard-height',state.keyboard?'156px':'0px');
    const s=current(),c=content(),modeTitle={discover:'Discover',predict:'Predict',recall:'Recall'}[state.mode];
    app.innerHTML=`<main class="shell theme-${state.concept}" id="shell"><header class="top"><button class="plain icon" data-action="back" aria-label="Back">←</button><div class="brand"><small>Hangul Tutor · composition lab</small><strong>${names[state.concept]}</strong></div><button class="plain" data-action="long">${state.long?'Short':'Long'} text</button><a class="plain" href="baseline.html" aria-label="Open unchanged baseline">Baseline ↗</a></header><nav class="concepts" aria-label="Visual concepts">${Object.keys(names).map(k=>`<button data-concept="${k}" aria-pressed="${state.concept===k}">${k.toUpperCase()} · ${['Storybook','Workbook','Stage'][Object.keys(names).indexOf(k)]}</button>`).join('')}</nav><nav class="modes" role="tablist" aria-label="Interaction modes">${['discover','predict','recall'].map(m=>`<button role="tab" data-mode="${m}" aria-selected="${state.mode===m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</nav><div class="workspace" id="workspace"><div class="instruction">${modeTitle} · step ${s.index+1} of ${state.mode==='predict'?3:state.mode==='recall'?3:2}</div><section class="stage" aria-label="Syllable composition stage"><div class="stage-inner">${c.visual}<div class="stage-hint">${state.mode==='discover'?'Watch where the vowel sits':state.mode==='predict'?'The dotted place needs a letter':s.index===2?'Read before revealing':'Build from the sound'}</div></div><img class="mascot" src="assets/jeong_${pose()}.png" alt="Jeong, ${pose()} pose"></section><section class="dialogue" aria-label="Jeong dialogue"><div class="speaker">Jeong · guide</div><div class="dialogue-text">${esc(dialogue())}</div></section><section class="exercise"><p class="task">${esc(c.task)}</p>${c.controls}${c.msg}</section></div><footer class="footer"><div class="footer-row"><button class="plain" data-action="review">Review steps</button><button class="plain" data-action="reset">Restart mode</button></div><button class="primary" data-action="primary">${primaryLabel()}</button><div class="footer-note">Manual mode switching · experimental grading · no mastery saved</div></footer></main>${state.keyboard?keyboard():''}${state.review?review():''}`;
    if(state.keyboard&&document.activeElement?.id==='answer')document.getElementById('answer')?.scrollIntoView({block:'nearest'});
  }
  function keyboard(){const latin=state.mode==='recall'&&current().index===2;return `<div class="mock-keyboard" aria-label="Simulated keyboard for layout testing"><small>SIMULATED KEYBOARD · layout test only</small><div class="key-row">${(latin?['n','a','o','d']:['ㄴ','ㄷ','ㅁ','ㅏ','ㅗ','ㅓ']).map(x=>`<button data-key="${x}">${x}</button>`).join('')}</div><div class="key-row">${(latin?['na','no','da']:['나','노','다','도']).map(x=>`<button data-key="${x}">${x}</button>`).join('')}<button class="wide" data-key="backspace">⌫</button></div><div class="key-row"><button class="wide" data-action="keyboard">Done</button><button class="wide" data-action="primary">${primaryLabel()}</button></div></div>`;}
  function review(){return `<div class="review-cover"><div class="review" role="dialog" aria-modal="true" aria-label="Review experiment steps"><button class="close" data-action="review">Close ✕</button><h2>Review the composition</h2><p>Jump between the three modes, or return to an earlier example. This prototype does not set mastery thresholds.</p>${['discover','predict','recall'].map(m=>`<button data-review="${m}:0">${m[0].toUpperCase()+m.slice(1)} · start</button>`).join('')}<button data-review="discover:1">Discover · ㄴ + ㅗ → 노</button><button data-review="predict:1">Predict · missing vowel in 노</button><button data-review="predict:2">Predict · missing consonant</button><button data-review="recall:1">Recall · construct “no”</button><button data-review="recall:2">Recall · separate decoding check</button></div></div>`;}
  function setStep(mode,index){state.mode=mode;const s=current();s.index=index;s.feedback='';s.correct=false;if(mode==='discover'){s.selected='';s.placed=false}if(mode==='recall'){s.consonant='';s.vowel='';s.typed=''}state.review=false;state.keyboard=false;render();}
  function wrongVowel(choice,ex){if(choice==='ㅗ'||choice==='ㅜ')return `${choice} is a horizontal vowel; it belongs below the consonant. This block needs ${ex.vowel} ${ex.orientation==='vertical'?'on the right':'below'}.`;return `${choice} changes the vowel sound. Keep ㄴ, then choose ${ex.vowel} ${ex.orientation==='vertical'?'on the right':'below'}.`;}
  function chooseDiscover(letter){const s=current();s.selected=letter;s.feedback='';render();}
  function placeDiscover(letter){const s=current(),ex=lesson();const value=letter||s.selected;if(!value){s.feedback='Choose a vowel tile first, then tap the dotted slot.';render();return}if(value!==ex.vowel){s.placed=false;s.correct=false;s.feedback=wrongVowel(value,ex)}else{s.placed=true;s.correct=true;s.feedback=`${ex.consonant} + ${ex.vowel} makes ${ex.block} (“${ex.sound}”). The ${ex.vowel} sits ${ex.orientation==='vertical'?'to the right':'below'} ㄴ.`}render();}
  function choosePredict(letter){const s=current(),ex=lesson(),correct=ex.missing==='vowel'?ex.vowel:ex.consonant;if(letter===correct){s.correct=true;s.feedback=`${letter} completes ${ex.block}. The ${ex.missing} is in its correct position.`}else{s.correct=false;s.feedback=ex.missing==='consonant'?`${letter} changes the first sound. The consonant for this block is ㄴ; the ㅗ stays below it.`:wrongVowel(letter,ex)}render();}
  function evaluateRecall(){const s=current();if(s.index===2){const answer=s.typed.trim().toLowerCase();if(!answer){s.feedback='Type the sound you read before checking.';s.correct=false}else if(answer==='no'){s.correct=true;s.feedback='Correct: 노 reads “no.” The sound was hidden until your answer.'}else{s.correct=false;s.feedback='Look again: ㄴ gives the n sound, and ㅗ is the vowel below. Try the two-letter sound.'}render();return}
    const ex=lesson(),typed=s.typed.trim().normalize('NFC');let c=s.consonant,v=s.vowel;
    if(typed){const pieces={'나':['ㄴ','ㅏ'],'노':['ㄴ','ㅗ'],'다':['ㄷ','ㅏ'],'도':['ㄷ','ㅗ'],'너':['ㄴ','ㅓ'],'누':['ㄴ','ㅜ'],'마':['ㅁ','ㅏ'],'모':['ㅁ','ㅗ']}[typed];if(pieces){[c,v]=pieces}else{s.correct=false;s.feedback='Type one Hangul block, or use the consonant and vowel tiles.';render();return}}
    if(!c||!v){s.correct=false;s.feedback=`Choose both a consonant and a vowel for “${ex.sound},” or type the block.`}
    else if(c!==ex.consonant){s.correct=false;s.feedback=`${c} changes the first sound. “${ex.sound}” begins with ㄴ; keep checking the consonant.`}
    else if(v!==ex.vowel){s.correct=false;s.feedback=`${v} changes the vowel sound. “${ex.sound}” needs ${ex.vowel} ${ex.orientation==='vertical'?'to the right of':'below'} ㄴ.`}
    else{s.correct=true;s.feedback=`You built ${ex.block} from the sound “${ex.sound}.” ${ex.vowel} sits ${ex.orientation==='vertical'?'beside':'below'} ㄴ.`;s.consonant=c;s.vowel=v}
    render();
  }
  function primary(){const s=current();if(state.mode==='discover'){if(s.placed){setStep('discover',s.index===0?1:0)}else placeDiscover();return}if(state.mode==='predict'){if(s.correct)setStep('predict',s.index<2?s.index+1:0);return}if(s.correct){setStep('recall',s.index<2?s.index+1:0)}else evaluateRecall();}
  function back(){const s=current();if(s.index>0){setStep(state.mode,s.index-1)}else if(state.mode==='recall'){state.mode='predict';render()}else if(state.mode==='predict'){state.mode='discover';render()}else state.review=true,render();}
  app.addEventListener('click',e=>{const b=e.target.closest('button,[data-concept],[data-mode]');if(!b)return;if(b.dataset.concept){state.concept=b.dataset.concept;state.keyboard=false;render();return}if(b.dataset.mode){state.mode=b.dataset.mode;state.keyboard=false;render();return}if(b.dataset.tile){chooseDiscover(b.dataset.tile);return}if(b.dataset.slot){if(state.mode==='discover')placeDiscover();return}if(b.dataset.predict){choosePredict(b.dataset.predict);return}if(b.dataset.recall){const [part,value]=b.dataset.recall.split(':');const s=current();s[part]=value;s.typed='';s.feedback='';s.correct=false;render();return}if(b.dataset.review){const [mode,number]=b.dataset.review.split(':');setStep(mode,Number(number));return}if(b.dataset.key){const input=document.getElementById('answer');if(input){const s=current();s.typed=b.dataset.key==='backspace'?s.typed.slice(0,-1):s.typed+b.dataset.key;input.value=s.typed;input.focus();input.scrollIntoView({block:'nearest'})}return}switch(b.dataset.action){case'back':back();break;case'long':state.long=!state.long;render();break;case'review':state.review=!state.review;render();break;case'reset':setStep(state.mode,0);break;case'keyboard':state.keyboard=!state.keyboard;render();document.getElementById('answer')?.scrollIntoView({block:'nearest'});break;case'primary':primary();break;}});
  app.addEventListener('input',e=>{if(e.target.id==='answer')current().typed=e.target.value});
  app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='answer'){e.preventDefault();primary()}if(e.key==='Escape'&&state.review){state.review=false;render()}});
  app.addEventListener('dragstart',e=>{const tile=e.target.closest('[data-tile]');if(tile)e.dataTransfer.setData('text/plain',tile.dataset.tile)});
  app.addEventListener('dragover',e=>{if(e.target.closest('[data-slot]'))e.preventDefault()});
  app.addEventListener('drop',e=>{if(e.target.closest('[data-slot]')&&state.mode==='discover'){e.preventDefault();placeDiscover(e.dataTransfer.getData('text/plain'))}});
  window.__lab={state,render,setStep};
  render();
})();
</script></body></html>
